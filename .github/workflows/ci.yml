name: CI

on:
  # Branch pushes only: a release tag runs all of CI through release.yml.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The release workflow runs all of CI on the commit being released.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
