name: Release

# Builds a NEXUS release from its tag and publishes it, as MESH's
# release.yml does: all of CI on the tagged commit, then @valancex/nexus
# packed, published to npm with provenance, and a GitHub release with the
# tarball and the version's release notes.
#
# - A pushed `v*` tag publishes. Its tag must be `v` + the package.json
#   version. Tagging the release commit is the maintainer's step.
# - A manual run publishes only with `publish` set, and only from a tag;
#   otherwise it's a dry run: everything but the publishing.
# - A pull request that changes this workflow or package.json runs the
#   dry run.
#
# The release notes are docs/releases/vX.Y.Z.md when that file exists (a
# patch release), and otherwise docs/releases/vX.Y.md.
#
# Publishing needs the `NPM_ACCESS_TOKEN` secret: an npm granular access
# token that can publish to the @valancex organisation. It expires; a
# release needs a current one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and make the GitHub release (only from a tag)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p out
          pnpm pack --pack-destination out
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    env:
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out
      - name: Check what is being released
        run: |
          ls -l out
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          if [ "$(ls out/*.tgz | wc -l)" != "1" ] || [ ! -f "out/valancex-nexus-${version}.tgz" ]; then
            echo "::error::Expected exactly one tarball, valancex-nexus-${version}.tgz"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::The tag is ${GITHUB_REF_NAME}, but package.json is ${version}: tag ${tag}"
            exit 1
          fi
          if [ "$PUBLISH" = "true" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publishing needs a tag: push ${tag}"
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            notes="docs/releases/v$(echo "$version" | cut -d. -f1,2).md"
          fi
          if [ ! -f "$notes" ]; then
            echo "::error::No release notes at docs/releases/v${version}.md or ${notes}"
            exit 1
          fi
          echo "NOTES=${notes}" >> "$GITHUB_ENV"
          if npm view "@valancex/nexus@${version}" version > /dev/null 2>&1; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::@valancex/nexus@${version} is already on npm"
              exit 1
            fi
            echo "::warning::@valancex/nexus@${version} is already on npm; a release needs a version bump"
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          # Absolute, so npm reads the tarball as a file, not a GitHub spec.
          tarball="$PWD/out/valancex-nexus-${TAG#v}.tgz"
          if [ "$PUBLISH" = "true" ]; then
            npm publish "$tarball" --access public --provenance
          else
            npm publish "$tarball" --access public --provenance=false --dry-run
          fi
      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" --title "NEXUS $TAG" --notes-file "$NOTES" --verify-tag out/*.tgz
