name: Release

# Builds, packs and publishes @valancex/nexus to npm with provenance, and
# makes the GitHub release if there isn't one yet (as MESH's release.yml).
#
# - Publishing a GitHub release publishes. Its tag must be `v` + the
#   package.json version.
# - A manual run publishes only with `publish` set, and only from the
#   release's tag or from `main` once that version's tag exists; otherwise
#   it's a dry run: everything but the publishing.
# - A pull request that changes this workflow or package.json runs the
#   dry run. Pushes, including tag pushes, never publish.
#
# Publishing needs the `NPM_ACCESS_TOKEN` secret: an npm granular access
# token that can publish to the @valancex organisation. It expires; a
# release needs a current one.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm and make the GitHub release (only from a release tag, or main once the tag exists)"
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - package.json

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # All of CI, on the commit being released.
  ci:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build and pack
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p out
          pnpm pack --pack-destination out
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: out/
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm provenance
    env:
      PUBLISH: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: out
      - name: Check what is being released
        run: |
          ls -l out
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "TAG=${tag}" >> "$GITHUB_ENV"
          if [ "$PUBLISH" = "true" ]; then
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              if [ "$GITHUB_REF_NAME" != "$tag" ]; then
                echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
                exit 1
              fi
            elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
              if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
                echo "::error::No ${tag} tag: tag the release before publishing it from main"
                exit 1
              fi
            else
              echo "::error::Publishing runs only from a release tag or main, not ${GITHUB_REF}"
              exit 1
            fi
          fi
          if npm view "@valancex/nexus@${version}" version > /dev/null 2>&1; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::@valancex/nexus@${version} is already on npm"
              exit 1
            fi
            echo "::warning::@valancex/nexus@${version} is already on npm; a release needs a version bump"
          fi
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            npm publish ./out/*.tgz --access public --provenance
          else
            npm publish ./out/*.tgz --access public --provenance=false --dry-run
          fi
      - name: GitHub release
        if: env.PUBLISH == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists"
          else
            notes="docs/releases/v$(echo "${TAG#v}" | cut -d. -f1,2).md"
            gh release create "$TAG" --title "NEXUS $TAG" --notes-file "$notes" --verify-tag out/*.tgz
          fi
